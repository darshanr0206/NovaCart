server:
  port: ${PORT:8080}

spring:
  application:
    name: novacart-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novacart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:test@123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-env-to-a-long-random-value-min-256-bits}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}      # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TRJfbQMqfxPQ7F}
  key-secret: ${RAZORPAY_KEY_SECRET:ZOLSRpVhcfxUInSwx3wzYWEU}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:no-reply@novacart.app}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
